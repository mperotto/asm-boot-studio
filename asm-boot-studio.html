const EXAMPLES = {
hello:`; Hello World Bootloader - x86 Real Mode (NASM)
; Executado em 0x7C00 pela BIOS do PC
org 0x7c00
bits 16

start:
    cli
    xor ax, ax
    mov ds, ax
    mov es, ax
    mov ss, ax
    mov sp, 0x7c00
    sti

    mov si, msg
print_loop:
    lodsb
    or al, al
    jz print_done
    mov ah, 0x0e
    mov bh, 0
    int 0x10
    jmp print_loop
print_done:
    hlt

msg db 'Ola, Mundo! x86 Real Mode', 13, 10
    db 'Curitiba - Parana - Brasil', 13, 10
    db 'ASM Boot Studio v2.0', 13, 10, 0

times 510-($ - $$) db 0
dw 0xAA55`,

counter:`; Contador 9..1 -> GO!
org 0x7c00
bits 16

start:
    cli
    xor ax, ax
    mov ds, ax
    mov es, ax
    mov ss, ax
    mov sp, 0x7c00
    sti

    mov cx, 9
cnt_loop:
    push cx
    mov ah, 0x0e
    mov al, cl
    add al, 48
    mov bh, 0
    int 0x10
    mov al, 32
    int 0x10
    pop cx
    dec cx
    jnz cnt_loop

    mov si, go_msg
go_loop:
    lodsb
    or al, al
    jz halt
    mov ah, 0x0e
    mov bh, 0
    int 0x10
    jmp go_loop
halt:
    hlt

go_msg db '-> GO! Bootloader OK!', 13, 10, 0

times 510-($ - $$) db 0
dw 0xAA55`,

multi:`; Multi-linha com subrotina CALL
org 0x7c00
bits 16

start:
    cli
    xor ax, ax
    mov ds, ax
    mov es, ax
    mov ss, ax
    mov sp, 0x7c00
    sti

    mov ah, 0
    mov al, 3
    int 0x10

    mov si, line1
    call print
    mov si, line2
    call print
    mov si, line3
    call print
    mov si, line4
    call print
    hlt

print:
    lodsb
    or al, al
    jz pret
    mov ah, 0x0e
    mov bh, 0
    int 0x10
    jmp print
pret:
    ret

line1 db '================================', 13, 10, 0
line2 db '  ASM Boot Studio - x86 / NASM  ', 13, 10, 0
line3 db '  Curitiba / Parana / Brasil    ', 13, 10, 0
line4 db '================================', 13, 10, 0

times 510-($ - $$) db 0
dw 0xAA55`,

stage2:`; Bootloader em dois estagios
; A BIOS carrega apenas o primeiro setor em 0000:7C00.
; Este setor 1 carrega o setor 2 para 0000:8000 e salta para ele.
org 0x7c00
bits 16

STAGE2_ADDR equ 0x8000

start:
    cli
    xor ax, ax
    mov ds, ax
    mov es, ax
    mov ss, ax
    mov sp, 0x7c00
    sti

    mov [boot_drive], dl

    mov si, msg_stage1
    call print

    ; Ler 1 setor do disco:
    ; CH=cilindro 0, DH=cabeca 0, CL=setor 2.
    ; ES:BX=0000:8000 e o destino na memoria.
    xor ax, ax
    mov es, ax
    mov bx, STAGE2_ADDR
    mov ah, 0x02
    mov al, 1
    mov ch, 0
    mov cl, 2
    mov dh, 0
    mov dl, [boot_drive]
    int 0x13
    jc disk_error

    mov si, msg_jump
    call print
    jmp 0x0000:STAGE2_ADDR

disk_error:
    mov si, msg_error
    call print
halt:
    hlt
    jmp halt

print:
    lodsb
    or al, al
    jz .done
    mov ah, 0x0e
    mov bx, 0x0007
    int 0x10
    jmp print
.done:
    ret

boot_drive db 0
msg_stage1 db 'Stage 1: setor de boot em 7C00', 13, 10, 0
msg_jump   db 'Stage 1: setor 2 carregado em 8000', 13, 10, 0
msg_error  db 'Erro ao ler o setor 2', 13, 10, 0

times 510-($ - $$) db 0
dw 0xAA55

; Daqui para baixo esta o setor 2 do disco.
; Ele nao e carregado pela BIOS: quem carrega e o Stage 1.
stage2:
    mov ax, 0
    mov ds, ax
    mov es, ax

    mov si, msg_stage2 - stage2 + STAGE2_ADDR
    call print_stage2

    mov si, msg_kernel - stage2 + STAGE2_ADDR
    call print_stage2

stage2_halt:
    hlt
    jmp stage2_halt

print_stage2:
    lodsb
    or al, al
    jz .done
    mov ah, 0x0e
    mov bx, 0x0007
    int 0x10
    jmp print_stage2
.done:
    ret

msg_stage2 db 'Stage 2: codigo vindo do proximo setor!', 13, 10, 0
msg_kernel db 'Ideia central: bootloader pequeno carrega um kernel maior.', 13, 10, 0

times 1024-($ - $$) db 0`,

minimal:`; Bootloader minimo
org 0x7c00
bits 16
    hlt
times 510-($ - $$) db 0
dw 0xAA55`
};

// ═══════════════════════════════════════════════
// ASSEMBLER x86 REAL MODE (two-pass, NASM syntax)
// ═══════════════════════════════════════════════
class X86Asm {
  constructor(){this.reset()}
  reset(){this.org=0x7C00;this.bytes=[];this.labels={};this.errors=[];this.pc=0x7C00;this.pass=1;this.lineNum=0}

  assemble(src){
    this.errors=[];this.labels={};
    this._run(src,1); if(this.errors.length)return null;
    this._run(src,2); if(this.errors.length)return null;
    return new Uint8Array(this.bytes);
  }

  _run(src,pass){
    this.pass=pass;this.bytes=[];this.pc=this.org;this.lineNum=0;
    for(const[i,raw] of src.split('\n').entries()){
      this.lineNum=i+1;
      let line=raw;
      const ci=line.indexOf(';');if(ci>=0)line=line.substring(0,ci);
      line=line.trim();if(!line)continue;
      const lm=line.match(/^([.\w]+):\s*(.*)?$/);
      if(lm){
        if(pass===1){if(this.labels[lm[1]]!==undefined)this._err(`Label dup: ${lm[1]}`);else this.labels[lm[1]]=this.pc;}
        line=(lm[2]||'').trim();if(!line)continue;
      }
      this._parseLine(line);
      if(this.errors.length>8)break;
    }
  }

  _emit(...bs){for(const b of bs){this.bytes.push(b&0xFF);this.pc++}}
  _emit16(w){this._emit(w&0xFF,(w>>8)&0xFF)}
  _err(m){this.errors.push(`L${this.lineNum}: ${m}`)}

  _expr(s){
    s=s.trim();if(!s)return null;
    s=s.replace(/\$\$/g,`(${this.org})`).replace(/\$/g,`(${this.pc})`);
    for(const[lbl,addr] of Object.entries(this.labels)){
      const esc=lbl.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      s=s.replace(new RegExp(`(?<![\\w.])${esc}(?![\\w.])`, 'g'),`(${addr})`);
    }
    s=s.replace(/'(.)'/g,(_,c)=>c.charCodeAt(0));
    s=s.replace(/0x([0-9a-fA-F]+)/gi,(_,h)=>parseInt(h,16));

      case 2:return this.CF?1:0;case 3:return this.CF?0:1;
      case 4:return this.ZF?1:0;case 5:return this.ZF?0:1;
      case 6:return(this.CF||this.ZF)?1:0;case 7:return(!this.CF&&!this.ZF)?1:0;
      case 8:return this.SF?1:0;case 9:return this.SF?0:1;
      case 10:return this.PF?1:0;case 11:return this.PF?0:1;
      case 12:return(this.SF!==this.OF)?1:0;case 13:return(this.SF===this.OF)?1:0;
      case 14:return(this.ZF||(this.SF!==this.OF))?1:0;
      case 15:return(!this.ZF&&this.SF===this.OF)?1:0;
    }
    return 0;
  }
  // INT handler
  handleINT(n){
    if(n===0x10){
      if(this.ah===0x0E){
        const c=this.al;
        if(c===13)this.output+='\r';
        else if(c===10)this.output+='\n';
        else if(c>=32&&c<127)this.output+=String.fromCharCode(c);
      }else if(this.ah===0){
        this.output=''; // set video mode = clear
      }
    }
  }
  // Execute one instruction
  step(){
    if(this.halted)return;
    if(++this.steps>600000){this.halted=true;this.output+='\n[MAX STEPS]';return}
    const op=this.fb();
    switch(op){
      // Simple 1-byte
      case 0x90:break;
      case 0xF4:this.halted=true;return;
      case 0xFA:case 0xFB:break; // CLI STI
      case 0xF8:case 0xF9:break; // CLC STC
      case 0xFC:this.DF=0;break; // CLD
      case 0xFD:this.DF=1;break; // STD
      case 0xC3:this.ip=this.pop();return;
      case 0xCB:{this.ip=this.pop();this.s[1]=this.pop();return}
      case 0xCF:{this.ip=this.pop();this.s[1]=this.pop();break} // IRET simplified
      case 0x60:{const sp0=this.sp;for(let i=0;i<8;i++)this.push(i===4?sp0:this.r[i]);return}
      case 0x61:{for(let i=7;i>=0;i--)this.sr16(i,this.pop());return} // POPA simplified
      case 0x9C:this.push(this.CF|(this.PF<<2)|(this.ZF<<6)|(this.SF<<7)|(this.OF<<11));return;
      case 0x9D:{const f=this.pop();this.CF=f&1;this.PF=(f>>2)&1;this.ZF=(f>>6)&1;this.SF=(f>>7)&1;this.OF=(f>>11)&1;return}
      case 0x98:this.ax=this.al<0x80?this.al:(0xFF00|this.al);return;
      case 0x99:this.dx=this.ax&0x8000?0xFFFF:0;return;
      // String ops
      case 0xAC:this.al=this.rb(this.si);this.si=(this.si+(this.DF?-1:1))&0xFFFF;return;
      case 0xAD:this.ax=this.rw(this.si);this.si=(this.si+(this.DF?-2:2))&0xFFFF;return;
      case 0xAA:this.wb(this.di,this.al);this.di=(this.di+(this.DF?-1:1))&0xFFFF;return;
      case 0xAB:this.ww(this.di,this.ax);this.di=(this.di+(this.DF?-2:2))&0xFFFF;return;
      case 0xA4:this.wb(this.di,this.rb(this.si));this.si=(this.si+1)&0xFFFF;this.di=(this.di+1)&0xFFFF;return;
      case 0xAE:{const b=this.rb(this.di);this.di=(this.di+(this.DF?-1:1))&0xFFFF;this.alu(7,this.al,b,8);return}
      // INT
      case 0xCD:this.handleINT(this.fb());return;
      case 0xCC:this.handleINT(3);return;
      // PUSH r16
      case 0x50:case 0x51:case 0x52:case 0x53:
      case 0x54:case 0x55:case 0x56:case 0x57:this.push(this.r[op-0x50]);return;
      // POP r16
      case 0x58:case 0x59:case 0x5A:case 0x5B:
      case 0x5C:case 0x5D:case 0x5E:case 0x5F:this.sr16(op-0x58,this.pop());return;
      // PUSH imm
      case 0x68:this.push(this.fw());return;
      case 0x6A:this.push(this.fbs()&0xFFFF);return;
      // INC r16
      case 0x40:case 0x41:case 0x42:case 0x43:
      case 0x44:case 0x45:case 0x46:case 0x47:{const rr=op-0x40;this.sr16(rr,this.alu(0,this.r[rr],1,16));return}
      // DEC r16
      case 0x48:case 0x49:case 0x4A:case 0x4B:
      case 0x4C:case 0x4D:case 0x4E:case 0x4F:{const rr=op-0x48;this.sr16(rr,this.alu(5,this.r[rr],1,16));return}
      // MOV r8, imm8
      case 0xB0:case 0xB1:case 0xB2:case 0xB3:
      case 0xB4:case 0xB5:case 0xB6:case 0xB7:this.sr8(op-0xB0,this.fb());return;
      // MOV r16, imm16
      case 0xB8:case 0xB9:case 0xBA:case 0xBB:
      case 0xBC:case 0xBD:case 0xBE:case 0xBF:this.sr16(op-0xB8,this.fw());return;
      // XCHG r16,AX
      case 0x91:case 0x92:case 0x93:case 0x94:
      case 0x95:case 0x96:case 0x97:{const rr=op-0x90;const t=this.ax;this.ax=this.r[rr];this.sr16(rr,t);return}
      // JMP
      case 0xEB:{const r=this.fbs();this.ip=(this.ip+r)&0xFFFF;return}
      case 0xE9:{const r=this.fws();this.ip=(this.ip+r)&0xFFFF;return}
      case 0xEA:{this.ip=this.fw();this.s[1]=this.fw();return} // JMP far
      case 0xE8:{const r=this.fws();this.push(this.ip);this.ip=(this.ip+r)&0xFFFF;return}
      // Jcc short
      case 0x70:case 0x71:case 0x72:case 0x73:case 0x74:case 0x75:case 0x76:case 0x77:
      case 0x78:case 0x79:case 0x7A:case 0x7B:case 0x7C:case 0x7D:case 0x7E:case 0x7F:{
        const r=this.fbs();if(this.cc(op))this.ip=(this.ip+r)&0xFFFF;return}
      // JCXZ / LOOP
      case 0xE3:{const r=this.fbs();if(this.cx===0)this.ip=(this.ip+r)&0xFFFF;return}
      case 0xE2:{const r=this.fbs();this.cx=(this.cx-1)&0xFFFF;if(this.cx!==0)this.ip=(this.ip+r)&0xFFFF;return}
      case 0xE1:{const r=this.fbs();this.cx=(this.cx-1)&0xFFFF;if(this.cx!==0&&this.ZF)this.ip=(this.ip+r)&0xFFFF;return}
      case 0xE0:{const r=this.fbs();this.cx=(this.cx-1)&0xFFFF;if(this.cx!==0&&!this.ZF)this.ip=(this.ip+r)&0xFFFF;return}
      // MOV variants
      case 0x89:{const{mod,reg,rm}=this.mrm();const{v,a}=this.rmR16(mod,rm);this.rmW16(mod,rm,a,this.gr16(reg));return}
      case 0x8B:{const{mod,reg,rm}=this.mrm();const{v,a}=this.rmR16(mod,rm);this.sr16(reg,v);return}
      case 0x88:{const{mod,reg,rm}=this.mrm();const{v,a}=this.rmR8(mod,rm);this.rmW8(mod,rm,a,this.gr8(reg));return}
      case 0x8A:{const{mod,reg,rm}=this.mrm();const{v,a}=this.rmR8(mod,rm);this.sr8(reg,v);return}
      case 0x8E:{const{mod,reg,rm}=this.mrm();const{v}=this.rmR16(mod,rm);this.s[reg]=v;return}
      case 0x8C:{const{mod,reg,rm}=this.mrm();this.rmW16(mod,rm,mod!==3?this.ea(mod,rm):-1,this.s[reg]);return}
      case 0x8D:{const{mod,reg,rm}=this.mrm();this.sr16(reg,this.ea(mod,rm));return}
      // MOV mem (A0-A3)
      case 0xA0:{const a=this.fw();this.al=this.rb(a);return}
      case 0xA1:{const a=this.fw();this.ax=this.rw(a);return}
      case 0xA2:{const a=this.fw();this.wb(a,this.al);return}
      case 0xA3:{const a=this.fw();this.ww(a,this.ax);return}
      // ALU reg, r/m (00..3D)
      case 0x00:case 0x01:case 0x02:case 0x03:
      case 0x08:case 0x09:case 0x0A:case 0x0B:
      case 0x10:case 0x11:case 0x12:case 0x13:
      case 0x18:case 0x19:case 0x1A:case 0x1B:
      case 0x20:case 0x21:case 0x22:case 0x23:
      case 0x28:case 0x29:case 0x2A:case 0x2B:
      case 0x30:case 0x31:case 0x32:case 0x33:
      case 0x38:case 0x39:case 0x3A:case 0x3B:{
        const w=op&1,d=(op>>1)&1,opc=(op&0x38)>>3;
        const{mod,reg,rm}=this.mrm();
        if(w===0){const{v,a}=this.rmR8(mod,rm);const sv=this.gr8(reg);const r=this.alu(opc,d?sv:v,d?v:sv,8);if(opc!==7)this.rmW8(mod,rm,a,d?r:r);}
        else{const{v,a}=this.rmR16(mod,rm);const sv=this.gr16(reg);const r=this.alu(opc,d?sv:v,d?v:sv,16);if(opc!==7){if(d)this.sr16(reg,r);else this.rmW16(mod,rm,a,r);}}
        return;}
      // ALU AL/AX, imm
      case 0x04:this.al=this.alu(0,this.al,this.fb(),8);return;
      case 0x05:this.ax=this.alu(0,this.ax,this.fw(),16);return;
      case 0x0C:this.al=this.alu(1,this.al,this.fb(),8);return;
      case 0x0D:this.ax=this.alu(1,this.ax,this.fw(),16);return;
      case 0x14:this.al=this.alu(2,this.al,this.fb(),8);return;
      case 0x15:this.ax=this.alu(2,this.ax,this.fw(),16);return;
      case 0x1C:this.al=this.alu(3,this.al,this.fb(),8);return;
      case 0x1D:this.ax=this.alu(3,this.ax,this.fw(),16);return;
      case 0x24:this.al=this.alu(4,this.al,this.fb(),8);return;
      case 0x25:this.ax=this.alu(4,this.ax,this.fw(),16);return;
      case 0x2C:this.al=this.alu(5,this.al,this.fb(),8);return;
      case 0x2D:this.ax=this.alu(5,this.ax,this.fw(),16);return;
      case 0x34:this.al=this.alu(6,this.al,this.fb(),8);return;
      case 0x35:this.ax=this.alu(6,this.ax,this.fw(),16);return;
      case 0x3C:this.alu(7,this.al,this.fb(),8);return;
      case 0x3D:this.alu(7,this.ax,this.fw(),16);return;
      // TEST
      case 0x84:{const{mod,reg,rm}=this.mrm();const{v}=this.rmR8(mod,rm);this.alu(4,v,this.gr8(reg),8);return}
      case 0x85:{const{mod,reg,rm}=this.mrm();const{v}=this.rmR16(mod,rm);this.alu(4,v,this.gr16(reg),16);return}
      case 0xA8:this.alu(4,this.al,this.fb(),8);return;
      case 0xA9:this.alu(4,this.ax,this.fw(),16);return;
      // Immediate group 80/81/83
      case 0x80:{const{mod,reg,rm}=this.mrm();const imm=this.fb();const{v,a}=this.rmR8(mod,rm);const r=this.alu(reg,v,imm,8);if(reg!==7)this.rmW8(mod,rm,a,r);return}
      case 0x81:{const{mod,reg,rm}=this.mrm();const imm=this.fw();const{v,a}=this.rmR16(mod,rm);const r=this.alu(reg,v,imm,16);if(reg!==7)this.rmW16(mod,rm,a,r);return}
      case 0x83:{const{mod,reg,rm}=this.mrm();const imm=this.fbs();const{v,a}=this.rmR16(mod,rm);const r=this.alu(reg,v,imm&0xFFFF,16);if(reg!==7)this.rmW16(mod,rm,a,r);return}
      // Shift group C0/C1/D0/D1/D2/D3
      case 0xC0:{const{mod,reg,rm}=this.mrm();const cnt=this.fb()&0x1F;const{v,a}=this.rmR8(mod,rm);this.rmW8(mod,rm,a,this._sh(reg,v,cnt,8));return}
      case 0xC1:{const{mod,reg,rm}=this.mrm();const cnt=this.fb()&0x1F;const{v,a}=this.rmR16(mod,rm);this.rmW16(mod,rm,a,this._sh(reg,v,cnt,16));return}
      case 0xD0:{const{mod,reg,rm}=this.mrm();const{v,a}=this.rmR8(mod,rm);this.rmW8(mod,rm,a,this._sh(reg,v,1,8));return}
      case 0xD1:{const{mod,reg,rm}=this.mrm();const{v,a}=this.rmR16(mod,rm);this.rmW16(mod,rm,a,this._sh(reg,v,1,16));return}
      case 0xD2:{const{mod,reg,rm}=this.mrm();const{v,a}=this.rmR8(mod,rm);this.rmW8(mod,rm,a,this._sh(reg,v,this.cl,8));return}
      case 0xD3:{const{mod,reg,rm}=this.mrm();const{v,a}=this.rmR16(mod,rm);this.rmW16(mod,rm,a,this._sh(reg,v,this.cl,16));return}
      // NOT/NEG/MUL/DIV F6/F7
      case 0xF6:{const{mod,reg,rm}=this.mrm();const{v,a}=this.rmR8(mod,rm);
        if(reg<=1){this.alu(4,v,this.fb(),8);}
        else if(reg===2)this.rmW8(mod,rm,a,(~v)&0xFF);
        else if(reg===3){const r=(0-v)&0xFF;this.CF=r?1:0;this.rmW8(mod,rm,a,r);}
        else if(reg===4){this.ax=(this.al*v)&0xFFFF;}
        return;}
      case 0xF7:{const{mod,reg,rm}=this.mrm();const{v,a}=this.rmR16(mod,rm);
        if(reg<=1){this.alu(4,v,this.fw(),16);}
        else if(reg===2)this.rmW16(mod,rm,a,(~v)&0xFFFF);
        else if(reg===3){const r=(0-v)&0xFFFF;this.CF=r?1:0;this.rmW16(mod,rm,a,r);}
        else if(reg===4){const res=(this.ax*v)>>>0;this.ax=res&0xFFFF;this.dx=(res>>16)&0xFFFF;}
        else if(reg===6){if(v){this.ax=Math.trunc(this.ax/v)&0xFFFF;this.dx=this.ax%v;}}
        return;}
      // INC/DEC r/m FE/FF
      case 0xFE:{const{mod,reg,rm}=this.mrm();const{v,a}=this.rmR8(mod,rm);
        if(reg===0)this.rmW8(mod,rm,a,this.alu(0,v,1,8));
        else if(reg===1)this.rmW8(mod,rm,a,this.alu(5,v,1,8));
        return;}
      case 0xFF:{const{mod,reg,rm}=this.mrm();const{v,a}=this.rmR16(mod,rm);
        if(reg===0)this.rmW16(mod,rm,a,this.alu(0,v,1,16));
        else if(reg===1)this.rmW16(mod,rm,a,this.alu(5,v,1,16));
        else if(reg===2){this.push(this.ip);this.ip=v;}
        else if(reg===4){this.ip=v;}
        else if(reg===6)this.push(v);
        return;}
      // IN/OUT (ignore)
      case 0xE4:case 0xE5:this.fb();return;
      case 0xE6:case 0xE7:this.fb();return;
      case 0xEC:case 0xED:case 0xEE:case 0xEF:return;
      // CBW/CWD extra
      case 0xD7:return; // XLAT
      // Unknown: stop if in padding area
      default:if(this.ip>0x7E10)this.halted=true;break;
    }
  }
  _sh(op,v,cnt,bits){
    if(!cnt)return v;
    const m=bits===8?0xFF:0xFFFF,b=bits===8?0x80:0x8000;
    for(let i=0;i<cnt;i++){
      switch(op){
        case 0:{const c=(v&b)?1:0;this.CF=c;v=((v<<1)&m)|(c?1:0);break} // ROL
        case 1:{const c=v&1;v=((v>>>1)|((this.CF?b:0)))&m;this.CF=c;break} // ROR with carry... actually:
        // ROL: top bit rotates to bit0 (no carry flag involvement)
        // ROR: bit0 rotates to top bit
        // Let me fix:
      }
      // Override with correct implementation
      if(op===0){const c=(v&b)?1:0;this.CF=c;v=((v<<1)&m)|(c?1:0)} // ROL
      else if(op===1){const c=v&1;this.CF=c;v=((v>>>1)|(c?b:0))&m} // ROR
      else if(op===2){const c=(v&b)?1:0;v=((v<<1)&m)|this.CF;this.CF=c} // RCL
      else if(op===3){const c=v&1;v=((v>>>1)|(this.CF?b:0))&m;this.CF=c} // RCR
      else if(op===4||op===6){this.CF=(v&b)?1:0;v=(v<<1)&m} // SHL/SAL
      else if(op===5){this.CF=v&1;v=(v>>>1)&m} // SHR
      else if(op===7){this.CF=v&1;v=((v>>>1)|(v&b))&m} // SAR
    }
    this.ZF=(v===0)?1:0;this.SF=(v&b)?1:0;
    return v;
  }
}

}

function openDb(){
  if(dbPromise)return dbPromise;
  dbPromise=new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=event=>{
      const db=event.target.result;
      if(!db.objectStoreNames.contains(PROJECT_STORE)){
        const store=db.createObjectStore(PROJECT_STORE,{keyPath:'id'});
        store.createIndex('updatedAt','updatedAt');
      }
      if(!db.objectStoreNames.contains(META_STORE)){
        db.createObjectStore(META_STORE,{keyPath:'key'});
      }
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error('IndexedDB error'));
  });
  return dbPromise;
}

async function idbGet(storeName,key){
  const db=await openDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(storeName,'readonly');
    const req=tx.objectStore(storeName).get(key);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}

async function idbGetAll(storeName){
  const db=await openDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(storeName,'readonly');
    const req=tx.objectStore(storeName).getAll();
    req.onsuccess=()=>resolve(req.result||[]);
    req.onerror=()=>reject(req.error);
  });
}

async function idbPut(storeName,value){
  const db=await openDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(storeName,'readwrite');
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
    tx.objectStore(storeName).put(value);
  });
}

async function idbDelete(storeName,key){
  const db=await openDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(storeName,'readwrite');
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
    tx.objectStore(storeName).delete(key);
  });
}

function normalizeProjectName(name){
  return (name||'').trim()||'boot';
}

function sourceFilename(){
  return normalizeProjectName(projectNameEl.value).replace(/[\\/:*?"<>|]+/g,'-')+'.asm';
}

function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  link.href=url;
  link.download=name;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

async function readProjects(){
  const list=await idbGetAll(PROJECT_STORE);
  return Array.isArray(list)?list:[];
}

async function saveProjectRecord(project){
  await idbPut(PROJECT_STORE,project);
}

async function saveDraft(){
  await idbPut(META_STORE,{
    key:'draft',
    code:getEditorCode(),
    projectName:normalizeProjectName(projectNameEl.value),
    currentProjectId
  });
}

async function loadDraft(){
  try{
    const draft=await idbGet(META_STORE,'draft');
    if(!draft)return false;
    if(typeof draft.code==='string')setEditorCode(draft.code);
    projectNameEl.value=normalizeProjectName(draft.projectName||'boot');
    currentProjectId=typeof draft.currentProjectId==='string'?draft.currentProjectId:null;
    return true;
  }catch{
    return false;
  }
}

async function refreshSavedList(){
  const projects=(await readProjects()).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  const selected=currentProjectId;
  savedSel.innerHTML='';
  if(!projects.length){
    const opt=document.createElement('option');
    opt.value='';
    opt.textContent=t('noSaved');
    savedSel.appendChild(opt);
  }else{
    for(const project of projects){
      const opt=document.createElement('option');
      opt.value=project.id;
      opt.textContent=project.name;
      savedSel.appendChild(opt);
    }
    if(selected&&projects.some(p=>p.id===selected))savedSel.value=selected;
  }
  const hasSelection=!!savedSel.value;
  btnLoadSaved.disabled=!hasSelection;
  btnDeleteSaved.disabled=!hasSelection;
}

function replaceEditorCode(code){
  setEditorCode(code);
  resetImageDownload();
  destroyV86();
}

async function saveCurrentProject(){
  const now=Date.now();
  const name=normalizeProjectName(projectNameEl.value);
  const id=currentProjectId||`project-${now}`;
  const record={id,name,code:getEditorCode(),updatedAt:now};
  currentProjectId=id;
  projectNameEl.value=name;
  await saveProjectRecord(record);
  await saveDraft();
  await refreshSavedList();
  setMsg('✅ '+t('saveDone'),'ok');
}

async function saveAsNewProject(){
  currentProjectId=null;
  await saveCurrentProject();
  setMsg('✅ '+t('saveAsDone'),'ok');
}

async function loadSavedProject(id){
  const project=await idbGet(PROJECT_STORE,id);
  if(!project){
    setMsg('⚠️ '+t('chooseSaved'),'warn');
    return;
  }
  currentProjectId=project.id;
  projectNameEl.value=normalizeProjectName(project.name);
  replaceEditorCode(project.code||'');
  hexOutEl.textContent=t('hexPlaceholder');
  hexOutEl.style.color='#484f58';
  szEl.textContent='';
  await saveDraft();
  await refreshSavedList();
  setMsg('✅ '+t('loadDone'),'ok');
}

async function deleteSavedProject(id){
  if(!id){
    setMsg('⚠️ '+t('chooseSaved'),'warn');
    return;
  }
  if(!confirm(t('askDelete')))return;
  await idbDelete(PROJECT_STORE,id);
  if(currentProjectId===id)currentProjectId=null;
  await saveDraft();
  await refreshSavedList();
  setMsg('✅ '+t('deleteDone'),'ok');
}

async function migrateLegacyLocalStorage(){
  try{
    const migrated=await idbGet(META_STORE,'legacy-migrated');
    if(migrated)return;
    const rawProjects=localStorage.getItem(LEGACY_PROJECTS_KEY);
    const rawDraft=localStorage.getItem(LEGACY_DRAFT_KEY);
    const projects=rawProjects?JSON.parse(rawProjects):[];
    if(Array.isArray(projects)){
      for(const project of projects){
        if(project&&project.id)await saveProjectRecord(project);
      }
    }
    if(rawDraft){
      const draft=JSON.parse(rawDraft);
      await idbPut(META_STORE,{key:'draft',...draft});
    }
    await idbPut(META_STORE,{key:'legacy-migrated',value:true});
  }catch{}
}

function updateExampleLabels(){
  const labels=t('exampleLabels');
  for(const option of exSel.options)option.textContent=labels[option.value]||option.value;
}

function resetV86Screen(){
  v86ScreenEl.innerHTML='<div></div><canvas></canvas>';
}

// CodeMirror uses contenteditable div (not INPUT/TEXTAREA) so v86 doesn't
// auto-skip it. Use v86's own keyboard_set_status API to disable/enable.
editorEl.addEventListener('focusin',()=>{
  if(v86Emulator)v86Emulator.keyboard_set_status(false);
});
editorEl.addEventListener('focusout',()=>{
  if(v86Emulator)v86Emulator.keyboard_set_status(true);
});
// Canvas has no tabindex → clicking it doesn't trigger focusout on editor.
// Explicitly blur editor and re-enable v86 keyboard on mousedown over display.
v86WrapEl.addEventListener('mousedown',()=>{
  if(editorEl.contains(document.activeElement))document.activeElement.blur();
  if(v86Emulator)v86Emulator.keyboard_set_status(true);
});

function focusEditor(){
  if(asmEditor&&asmEditor.focus)asmEditor.focus();
  else{const cm=editorEl.querySelector('.cm-editor');if(cm)cm.focus();}
}

async function destroyV86(){
  if(!v86Emulator)return;
  const vm=v86Emulator;
  v86Emulator=null;
  try{await vm.stop()}catch{}
  try{await vm.destroy()}catch{}
  resetV86Screen();
}

function updateStaticTexts(){
  document.documentElement.lang=I18N[currentLang].htmlLang;
  projectNameEl.placeholder=t('projectNamePlaceholder');
  fileMenuBtn.textContent=t('fileMenu');
  btnOpen.textContent=t('open');
  btnSaveSource.textContent=t('saveSource');
  btnSaveLocal.textContent=t('saveLocal');
  btnSaveAs.textContent=t('saveAs');
  btnCredits.textContent=t('credits');
  btnLoadSaved.textContent=t('loadSaved');
  btnDeleteSaved.textContent=t('deleteSaved');
  btnRun.textContent=t('run');
  btnDownload.textContent=t('download');
  pillEl.textContent=t('pill');
  rlabelEl.textContent=t('outputLabel');
  renderCredits();
  hexOutEl.textContent=hexOutEl.style.color==='rgb(72, 79, 88)'||hexOutEl.style.color==='#484f58'?t('hexPlaceholder'):hexOutEl.textContent;
  if(msgEl.className==='info'&&(!msgEl.textContent||msgEl.textContent===I18N['pt-BR'].initialMsg||msgEl.textContent===I18N.en.initialMsg||msgEl.textContent===I18N['zh-CN'].initialMsg))setMsg(t('initialMsg'),'info');
  updateExampleLabels();
  if(!lastAssembledImage)szEl.textContent='';
  refreshSavedList();
}

function setLanguage(lang){
  currentLang=I18N[lang]?lang:'pt-BR';
  langSel.value=currentLang;
  localStorage.setItem('asm-boot-studio.lang',currentLang);
  updateStaticTexts();
}

function v86BufferFromBytes(bytes){
  return bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength);
}

const FLOPPY_1440_SIZE=1474560;

function floppyImageFromBytes(bytes){
  const size=Math.max(bytes.length,FLOPPY_1440_SIZE);
  const image=new Uint8Array(size);
  image.set(bytes);
  return image;
}

async function runInV86(result){
  if(typeof V86==='undefined')throw new Error('v86 nao esta disponivel.');
  await destroyV86();
  resetV86Screen();
  v86WrapEl.style.display='block';
  setMsg(t('v86Booting'),'info');
  v86Emulator=new V86({
    wasm_path:'./vendor/v86/v86.wasm',
    memory_size:32*1024*1024,
    vga_memory_size:8*1024*1024,
    screen_container:v86ScreenEl,
    bios:{url:'./vendor/v86/seabios.bin'},
    vga_bios:{url:'./vendor/v86/vgabios.bin'},
    fda:{buffer:v86BufferFromBytes(floppyImageFromBytes(result))},
    boot_order:0x231,
    autostart:true,
  });
  v86Emulator.add_listener('emulator-ready',()=>{
    setMsg('✅ '+t('v86Ready'),'ok');
    setTimeout(focusEditor,100);
  });
}

function sourceOrg(src){
  const m=src.match(/^\s*org\s+([^\s;]+)/im);
  if(!m)return 0x7C00;
  const raw=m[1].trim().toLowerCase();
  if(raw.startsWith('0x'))return parseInt(raw,16);
  if(raw.endsWith('h'))return parseInt(raw.slice(0,-1),16);
  const n=parseInt(raw,10);
  return Number.isFinite(n)?n:0x7C00;
}

let nasmWorker;
let wasmJobId=0;
const wasmPending=new Map();

function getNasmWorker(){
  if(!nasmWorker){
    nasmWorker=new Worker('./nasm-worker.js');
    nasmWorker.addEventListener('message',event=>{
      const msg=event.data;
      const pending=wasmPending.get(msg.id);
      if(!pending)return;
      wasmPending.delete(msg.id);
      if(msg.ok)pending.resolve(new Uint8Array(msg.bytes));
      else pending.reject(new Error(msg.error||'Falha ao montar com NASM WASM.'));
    });
  }
  return nasmWorker;
}

function assembleWithWasm(source){
  return new Promise((resolve,reject)=>{
    const id=++wasmJobId;
    wasmPending.set(id,{resolve,reject});
    getNasmWorker().postMessage({id,source});
  });
}

function initEditor(){
  if(!globalThis.AsmEditorBundle?.createAsmEditor){
    codeEl.style.display='block';
    codeEl.style.width='100%';
    codeEl.style.height='100%';
    codeEl.style.background='#0d1117';
    codeEl.style.color='#e6edf3';
    codeEl.style.border='0';
    codeEl.style.outline='0';
    codeEl.addEventListener('input',()=>{resetImageDownload();saveDraft()});
    return;
  }
  asmEditor=AsmEditorBundle.createAsmEditor({
    parent:editorEl,
    doc:codeEl.value,
    onChange:value=>{
      codeEl.value=value;
      resetImageDownload();
      saveDraft();
    }
  });
}

exSel.addEventListener('change',async()=>{
  currentProjectId=null;
  const val=exSel.value;
  if(EXAMPLES[val]!==undefined){
    setEditorCode(EXAMPLES[val]);
  }else{
    try{
      setMsg(t('exampleLoaded'),'info');
      const r=await fetch('./examples/'+val+'.asm');
      if(!r.ok)throw new Error(r.status);
      setEditorCode(await r.text());
    }catch(e){setMsg('Failed to load example: '+e,'err');}
  }
  projectNameEl.value=val;
  setMsg(t('exampleLoaded'),'info');
  hexOutEl.textContent=t('hexPlaceholder');
  hexOutEl.style.color='#484f58';
  szEl.textContent='';
  resetImageDownload();
  destroyV86();
  saveDraft();
  refreshSavedList();
});

langSel.addEventListener('change',()=>setLanguage(langSel.value));
fileMenuBtn.addEventListener('click',event=>{
  event.stopPropagation();
  toggleFileMenu();
});
document.addEventListener('click',event=>{
  if(!fileMenuEl.contains(event.target))closeFileMenu();
});
projectNameEl.addEventListener('input',saveDraft);
btnOpen.addEventListener('click',()=>{closeFileMenu();fileOpenInput.click()});
btnSaveSource.addEventListener('click',()=>{
  closeFileMenu();
  downloadBlob(new Blob([getEditorCode()],{type:'text/plain;charset=utf-8'}),sourceFilename());
});
btnSaveLocal.addEventListener('click',()=>{closeFileMenu();saveCurrentProject()});
btnSaveAs.addEventListener('click',()=>{closeFileMenu();saveAsNewProject()});
btnCredits.addEventListener('click',openCredits);
btnLoadSaved.addEventListener('click',()=>loadSavedProject(savedSel.value));
btnDeleteSaved.addEventListener('click',()=>deleteSavedProject(savedSel.value));
creditsCloseEl.addEventListener('click',closeCredits);
creditsModalEl.addEventListener('click',event=>{
  if(event.target===creditsModalEl)closeCredits();
});
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'&&creditsModalEl.classList.contains('open'))closeCredits();
});
savedSel.addEventListener('change',()=>{
  const hasSelection=!!savedSel.value;
  btnLoadSaved.disabled=!hasSelection;
  btnDeleteSaved.disabled=!hasSelection;
});
fileOpenInput.addEventListener('change',async()=>{
  const file=fileOpenInput.files&&fileOpenInput.files[0];
  if(!file)return;
  try{
    const text=await file.text();
    currentProjectId=null;
    projectNameEl.value=file.name.replace(/\.[^.]+$/,'')||'boot';
    replaceEditorCode(text);
    hexOutEl.textContent=t('hexPlaceholder');
    hexOutEl.style.color='#484f58';
    szEl.textContent='';
    await saveDraft();
    await refreshSavedList();
    setMsg('✅ '+t('openedFile'),'ok');
  }catch{
    setMsg('❌ '+t('readFail'),'err');
  }finally{
    fileOpenInput.value='';
  }
});

async function initLocalProjects(){
  await migrateLegacyLocalStorage();
  if(!await loadDraft()){
    setEditorCode(EXAMPLES.hello);
    projectNameEl.value='hello';
  }
  initEditor();
  setLanguage(currentLang);
  await refreshSavedList();
}

initLocalProjects().catch(()=>{
  setEditorCode(EXAMPLES.hello);
  projectNameEl.value='hello';
  initEditor();
  setLanguage(currentLang);
  setMsg('⚠️ IndexedDB indisponivel. Usando apenas a sessao atual.','warn');
});

btnDownload.addEventListener('click',()=>{
  if(!lastAssembledImage)return;
  closeFileMenu();
  downloadBlob(new Blob([lastAssembledImage],{type:'application/octet-stream'}),'boot.img');
});

btnRun.addEventListener('click',async()=>{
  setMsg(t('assembling'),'info');
  btnRun.disabled=true;
  btnDownload.disabled=true;

  let result;
  const source=getEditorCode();
  const org=sourceOrg(source);
  try{
    result=await assembleWithWasm(source);
  }catch(err){
    setMsg('❌ '+err.message,'err');
    hexOutEl.textContent=err.message;
    hexOutEl.style.color='#f85149';
    szEl.textContent='';
    btnRun.disabled=false;
    resetImageDownload();
    return;
  }

  lastAssembledImage=result.slice();
  btnDownload.disabled=false;

  // Hex dump
  hexOutEl.style.color='#3fb950';
  const lines=[];
  for(let i=0;i<Math.min(result.length,512);i+=16){
    const addr=(org+i).toString(16).padStart(4,'0').toUpperCase();
    const hex=Array.from(result.slice(i,i+16)).map(b=>b.toString(16).padStart(2,'0').toUpperCase()).join(' ');
    lines.push(addr+': '+hex);
  }
  hexOutEl.textContent=lines.join('\n');
  szEl.textContent=result.length+' '+t('bytes');

  const sig=(result[511]<<8)|result[510];
  const sigOk=sig===0xAA55;
  setMsg('✅ '+result.length+' '+t('bytes')+' · '+(sigOk?'0xAA55 OK':'⚠️ '+t('noSignature'))+' · '+t('v86Booting'),'ok');
  await runInV86(result);
  btnRun.disabled=false;
});
</script>
